<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Motel Prestige — Hors ligne</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(135deg, #1e2532 0%, #2b3447 100%); color: #e8ecf3; }
  .card { width: 440px; text-align: center; background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 40px 36px; }
  .icon { font-size: 44px; margin-bottom: 14px; }
  h1 { font-size: 19px; font-weight: 800; }
  .sub { font-size: 13px; color: #9aa5b8; margin: 8px 0 24px; line-height: 1.6; }
  button { padding: 12px 22px; border: none; border-radius: 12px; cursor: pointer; font-size: 14px;
           font-weight: 700; margin: 0 5px; }
  .primary { background: linear-gradient(135deg,#3b5bdb,#4c6ef5); color: #fff; }
  .ghost { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #c4ccd9; }
  .msg { margin-top: 14px; font-size: 13px; color: #ff8787; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Serveur injoignable / Server unreachable</h1>
    <p class="sub">Le serveur PMS ne répond pas. Vérifiez qu'il est allumé et que le réseau fonctionne.<br/>
       The PMS server is not responding. Check that it is on and the network is up.</p>
    <button class="primary" id="retry">Réessayer / Retry</button>
    <button class="ghost" id="setup">Changer de serveur / Change server</button>
    <p class="msg" id="msg"></p>
  </div>
<script>
  const msg = document.getElementById("msg");
  document.getElementById("retry").addEventListener("click", async () => {
    msg.textContent = "";
    const res = await window.motel.retryServer();
    if (!res.ok) msg.textContent = "Toujours injoignable. / Still unreachable.";
  });
  document.getElementById("setup").addEventListener("click", () => window.motel.openSetup());
  // Auto-retry every 10s — reception just waits for the server to come back.
  setInterval(() => window.motel.retryServer(), 10000);
</script>
</body>
</html>
