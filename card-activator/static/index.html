<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Activation Carte — Motel Prestige</title>
<style>
  :root{
    --bg:#f4efe6; --card:#fffdf8; --text:#221d16; --muted:#6f6656; --border:#e8e0d0;
    --input:#f5efe4; --blue:#836428; --gold:#a17c3f; --gold-soft:#f3ead4;
    --good:#4a7a4e; --good-bg:#e8f0e6; --bad:#b0443f; --bad-bg:#f6e2df;
    --shadow:0 1px 2px rgba(60,45,20,.05), 0 10px 30px -14px rgba(60,45,20,.25);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#110e09; --card:#1b1710; --text:#f0e9db; --muted:#a89a80; --border:#2c2517;
    --input:#201b12; --blue:#c79a4e; --gold:#d9b978; --gold-soft:#2b2313;
    --good:#6faf6f; --good-bg:#17301a; --bad:#e07872; --bad-bg:#3a1a19;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px -14px rgba(0,0,0,.6);
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:radial-gradient(1000px 520px at 50% -14%, var(--gold-soft) 0%, transparent 60%), var(--bg);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;padding:18px 14px 40px}
  .serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.01em}
  .wrap{max-width:560px;margin:0 auto}
  .tabular{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
    background:linear-gradient(145deg,var(--gold),var(--blue));
    box-shadow:0 4px 14px -4px rgba(120,90,30,.5), inset 0 1px 0 rgba(255,255,255,.28)}
  .brand h1{font-size:19px;font-weight:600}
  .brand .sub{font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}
  .topbtns{display:flex;align-items:center;gap:8px}
  .lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--card)}
  .lang button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12px;
    padding:7px 12px;cursor:pointer;font-family:inherit}
  .lang button.on{background:var(--blue);color:#fff}
  .enc{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
    padding:7px 13px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .enc-on{background:var(--good-bg);color:var(--good)} .enc-off{background:var(--bad-bg);color:var(--bad)}
  .enc-wait{background:var(--gold-soft);color:var(--gold)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
    padding:22px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}

  /* big room input */
  .room-in{width:100%;background:var(--input);border:2px solid var(--border);border-radius:14px;
    padding:16px 18px;font-size:38px;font-weight:700;text-align:center;color:var(--text);outline:none;
    letter-spacing:.06em;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
  .room-in:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
  .room-in::placeholder{color:var(--muted);opacity:.45;font-weight:600}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

  /* duration grid */
  .durs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
  .dur{border:1.5px solid var(--border);background:var(--input);color:var(--text);border-radius:13px;
    padding:14px 4px;font-size:15px;font-weight:700;cursor:pointer;transition:all .12s;text-align:center;line-height:1.15}
  .dur small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:2px}
  .dur.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 16px -6px rgba(120,90,30,.5)}
  .dur.on small{color:rgba(255,255,255,.85)}
  @media (max-width:420px){ .durs{grid-template-columns:repeat(3,1fr)} .dur{font-size:14px} }

  .btn{width:100%;border:none;border-radius:14px;padding:17px;font-size:17px;font-weight:700;color:#fff;
    background:var(--blue);cursor:pointer;letter-spacing:.01em;margin-top:18px;
    box-shadow:0 2px 4px rgba(60,45,20,.2), inset 0 1px 0 rgba(255,255,255,.14);transition:filter .15s,transform .06s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-lg{font-size:19px;padding:19px}
  .btn2{background:transparent;color:var(--muted);border:1px solid var(--border);box-shadow:none;
    width:auto;padding:8px 14px;font-size:13px;font-weight:600;margin:0}
  input.txt{width:100%;background:var(--input);border:1px solid var(--border);border-radius:11px;
    padding:12px 14px;font-size:16px;color:var(--text);outline:none}
  input.txt:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}

  /* options */
  .opts summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;list-style:none;padding:4px 0}
  .opts summary::-webkit-details-marker{display:none}
  .opts[open] summary{margin-bottom:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* success */
  .ok{border-radius:16px;padding:20px;margin-top:16px;text-align:center;
    background:var(--good-bg);border:1px solid var(--good)}
  .ok.warn{background:var(--bad-bg);border-color:var(--bad)}
  .ok .big{font-size:40px;font-weight:700}
  .ok .rm{font-size:15px;font-weight:700;color:var(--text)}
  .ok .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;margin-top:12px}
  .p-good{background:var(--card);color:var(--good)} .p-bad{background:var(--card);color:var(--bad)}

  .sec{font-size:15px;font-weight:700;margin-bottom:2px}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .act{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .act:first-child{border-top:none}
  .muted{color:var(--muted)} .center{text-align:center}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
  a{color:var(--gold);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark">🔑</div>
      <div>
        <h1 class="serif" data-fr="Activation Carte" data-en="Card Activation"></h1>
        <div class="sub">Motel Prestige</div>
      </div>
    </div>
    <div class="topbtns">
      <span id="enc" class="enc enc-wait"><span class="dot"></span>…</span>
      <div class="lang">
        <button id="lfr" onclick="setLang('fr')">FR</button>
        <button id="len" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login" class="card" style="max-width:380px;margin:0 auto">
    <label data-fr="Mot de passe du personnel" data-en="Staff password"></label>
    <input id="pw" class="txt" type="password" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()"/>
    <div id="loginErr" class="pill p-bad hidden" style="margin-top:10px"></div>
    <button class="btn" onclick="login()" data-fr="Se connecter" data-en="Sign in"></button>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="card">
      <!-- 1. Room -->
      <label data-fr="① Chambre" data-en="① Room"></label>
      <input id="room" class="room-in" type="text" inputmode="numeric" autocomplete="off" placeholder="203"/>
      <div class="hint" data-fr="Ouvre la serrure ET l'energy saver de cette chambre"
           data-en="Opens this room's door lock AND its energy saver"></div>

      <!-- 2. Duration -->
      <label style="margin-top:22px" data-fr="② Durée" data-en="② Duration"></label>
      <div class="durs" id="durs"></div>

      <!-- 3. Activate -->
      <button class="btn btn-lg" id="go" onclick="activate()"
        data-fr="Activer la carte" data-en="Activate card"></button>
      <div id="result"></div>

      <!-- options -->
      <details class="opts" style="margin-top:16px">
        <summary data-fr="⚙ Options (bâtiment, libellé, durée exacte)"
                 data-en="⚙ Options (building, label, exact hours)"></summary>
        <div class="row2">
          <div>
            <label data-fr="Bâtiment" data-en="Building"></label>
            <input id="building" class="txt" type="text" placeholder="01"/>
          </div>
          <div>
            <label data-fr="Heures exactes" data-en="Exact hours"></label>
            <input id="hours" class="txt" type="number" min="1" max="744" step="1" placeholder="5" oninput="pickCustom()"/>
          </div>
        </div>
        <div style="margin-top:12px">
          <label data-fr="Libellé (optionnel)" data-en="Label (optional)"></label>
          <input id="label" class="txt" type="text" placeholder="ex: carte réception"/>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="hd">
        <div class="sec serif" data-fr="Cartes récentes" data-en="Recent cards"></div>
        <button class="btn2" onclick="refresh()" data-fr="Rafraîchir" data-en="Refresh"></button>
      </div>
      <div id="list"><div class="muted center" style="padding:16px 0" data-fr="Chargement…" data-en="Loading…"></div></div>
    </div>
    <div class="foot"><a onclick="logout()" data-fr="Se déconnecter" data-en="Sign out"></a> · <span id="bridgeInfo" class="muted"></span></div>
  </div>
</div>

<script>
const PRESETS=[["1h",1],["2h",2],["3h",3],["6h",6],["12h",12],["1j / 1d",24],["1 sem / 1wk",168],["1 mois / 1mo",720]];
const TXT={
  fr:{encOn:"Encodeur en ligne",encOff:"Encodeur hors ligne",saving:"Activation…",
      okEnc:"Encodée — serrure + energy saver",okOff:"Enregistrée — encodeur hors ligne",
      okNoRoom:"Enregistrée (sans chambre → non encodée)",validTo:"Valide jusqu'à",
      needRoom:"Entrez d'abord le numéro de chambre",revoke:"Révoquer",revokeQ:"Révoquer cette carte ?",
      none:"Aucune carte pour le moment",wrongPw:"Mot de passe incorrect",expired:"expirée",revoked:"révoquée",noRoom:"sans chambre"},
  en:{encOn:"Encoder online",encOff:"Encoder offline",saving:"Activating…",
      okEnc:"Encoded — door lock + energy saver",okOff:"Recorded — encoder offline",
      okNoRoom:"Recorded (no room → not encoded)",validTo:"Valid until",
      needRoom:"Enter the room number first",revoke:"Revoke",revokeQ:"Revoke this card?",
      none:"No cards yet",wrongPw:"Wrong password",expired:"expired",revoked:"revoked",noRoom:"no room"}
};
let lang=localStorage.getItem("cta_lang")||"fr";
let token=localStorage.getItem("cta_token")||"";
let sel=24, acts=[];
const t=k=>TXT[lang][k];

function applyLang(){
  document.documentElement.lang=lang;
  document.getElementById("lfr").classList.toggle("on",lang==="fr");
  document.getElementById("len").classList.toggle("on",lang==="en");
  document.querySelectorAll("[data-fr]").forEach(el=>{ el.textContent=el.getAttribute("data-"+lang); });
  renderDurs(); paint(); syncEnc();
}
function setLang(l){ lang=l; localStorage.setItem("cta_lang",l); applyLang(); }

function api(path,opts={}){
  opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(token) opts.headers["Authorization"]="Bearer "+token;
  return fetch(path,opts).then(async r=>{
    if(r.status===401){logout();throw new Error("401");}
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"Error");
    return d;
  });
}
function show(a){document.getElementById("login").classList.toggle("hidden",a);document.getElementById("app").classList.toggle("hidden",!a);}
async function login(){
  const pw=document.getElementById("pw").value, err=document.getElementById("loginErr");
  try{
    const d=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})})
      .then(async r=>{const j=await r.json();if(!r.ok)throw new Error();return j;});
    token=d.token; localStorage.setItem("cta_token",token); err.classList.add("hidden"); boot();
  }catch(e){ err.textContent=t("wrongPw"); err.classList.remove("hidden"); }
}
function logout(){token="";localStorage.removeItem("cta_token");show(false);}

function renderDurs(){
  const c=document.getElementById("durs"); if(!c) return; c.innerHTML="";
  PRESETS.forEach(([lbl,h])=>{
    const parts=lbl.split(" / ");
    const b=document.createElement("button"); b.className="dur"+(sel===h&&!document.getElementById("hours").value?" on":"");
    b.innerHTML=parts.length>1?`${parts[lang==="fr"?0:1]}`:lbl;
    b.onclick=()=>{sel=h;document.getElementById("hours").value="";renderDurs();};
    c.appendChild(b);
  });
}
function pickCustom(){const v=parseFloat(document.getElementById("hours").value);if(!isNaN(v)&&v>0){sel=Math.max(1,Math.min(744,v));renderDurs();}}
function fmt(iso){return new Date(iso).toLocaleString(lang==="fr"?"fr-FR":"en-US",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}
function human(s){if(s<=0)return t("expired");const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);if(d>0)return`${d}j ${h}h`;if(h>0)return`${h}h ${m}m`;return`${m}m ${s%60}s`;}

async function activate(){
  const room=document.getElementById("room").value.trim();
  const go=document.getElementById("go"); const r=document.getElementById("result");
  if(!room){ r.innerHTML=`<div class="ok warn"><div class="rm">${t("needRoom")}</div></div>`; document.getElementById("room").focus(); return; }
  go.disabled=true; go.textContent=t("saving");
  try{
    const rec=await api("/api/activations",{method:"POST",body:JSON.stringify({
      hours:sel, room:room, building:document.getElementById("building").value||null,
      card_label:document.getElementById("label").value||null })});
    const enc=rec.encoded
      ? `<span class="pill p-good"><span class="dot"></span>${t("okEnc")}</span>`
      : `<span class="pill p-bad"><span class="dot"></span>${t("okOff")}</span>`;
    r.innerHTML=`<div class="ok${rec.encoded?"":" warn"}">
      <div class="serif big tabular">${human(rec.remaining_seconds)}</div>
      <div class="rm">${lang==="fr"?"Chambre":"Room"} ${rec.room}</div>
      <div class="sub">${t("validTo")} <b style="color:var(--text)">${fmt(rec.expires_at)}</b></div>
      ${enc}</div>`;
    document.getElementById("label").value=""; refresh();
  }catch(e){ r.innerHTML=`<div class="ok warn"><div class="rm">${e.message||"Error"}</div></div>`; }
  finally{ go.disabled=false; go.textContent=lang==="fr"?"Activer la carte":"Activate card"; }
}
async function revoke(id){ if(!confirm(t("revokeQ")))return; try{await api(`/api/activations/${id}/revoke`,{method:"POST"});refresh();}catch(e){alert(e.message);} }

let encState={online:false,building:"",url:""};
function syncEnc(){
  const e=document.getElementById("enc");
  e.className="enc "+(encState.online?"enc-on":"enc-off");
  e.innerHTML=`<span class="dot"></span>${encState.online?t("encOn"):t("encOff")}`;
  document.getElementById("bridgeInfo").textContent=encState.url?`${encState.url} · ${lang==="fr"?"bât.":"bldg"} ${encState.building}`:"";
}
async function refresh(){
  try{
    acts=await api("/api/activations");
    const st=await api("/api/status");
    encState={online:st.encoder_online,building:st.building,url:st.bridge_url};
    const bEl=document.getElementById("building"); if(bEl&&!bEl.value) bEl.value=st.building||"";
    syncEnc();
  }catch(e){}
  paint();
}
function paint(){
  const l=document.getElementById("list"); if(!l) return;
  if(!acts.length){ l.innerHTML=`<div class="muted center" style="padding:16px 0">${t("none")}</div>`; return; }
  l.innerHTML=acts.map(a=>{
    const state=a.state==="active"
      ? `<span class="pill p-good tabular"><span class="dot"></span>${human(a.remaining_seconds)}</span>`
      : a.state==="revoked" ? `<span class="pill p-bad">${t("revoked")}</span>`
      : `<span class="pill" style="color:var(--muted)">${t("expired")}</span>`;
    return `<div class="act">
      <div><div style="font-weight:700">${lang==="fr"?"Chambre":"Room"} ${a.room||"—"}
        <span class="muted" style="font-weight:400;font-size:12px">${a.card_label?"· "+a.card_label:(a.room?"":"· "+t("noRoom"))}</span></div>
        <div class="muted tabular" style="font-size:12px">${fmt(a.valid_from)} → ${fmt(a.expires_at)}</div></div>
      <div style="display:flex;align-items:center;gap:9px">${state}
        ${a.state==="active"?`<button class="btn2" onclick="revoke(${a.id})">${t("revoke")}</button>`:""}</div>
    </div>`;
  }).join("");
}
setInterval(()=>{let c=false;acts.forEach(a=>{if(a.state==="active"){a.remaining_seconds=Math.max(0,a.remaining_seconds-1);if(a.remaining_seconds===0){a.state="expired";c=true;}}});paint();},1000);

function boot(){ show(true); applyLang(); refresh(); }
applyLang();
if(token) boot(); else show(false);
</script>
</body>
</html>
